# 精簡版 MediaMTX 設定：只開 WebRTC(主要) + RTSP(VLC 備援)
logLevel: info

# 只給本機看門狗用
api: true
apiAddress: 127.0.0.1:9997

rtmp: false
hls: false
srt: false
moq: false

rtsp: true
rtspAddress: :8554
rtspTransports: [udp, tcp]

webrtc: true
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
# UDP 被擋的網路改走 TCP
webrtcLocalTCPAddress: :8189
# 比賽現場可能沒有網際網路：不要依賴 STUN
webrtcICEServers2: []

paths:
  cam:
    source: udp+rtp://127.0.0.1:5004
    rtpSDP: |
      v=0
      o=- 0 0 IN IP4 127.0.0.1
      s=cam
      c=IN IP4 127.0.0.1
      t=0 0
      m=video 5004 RTP/AVP 96
      a=rtpmap:96 H264/90000
      a=fmtp:96 packetization-mode=1
    # 攝影機程式掛掉或被拔掉會自動重啟
    runOnInit: ./cam.sh
    runOnInitRestart: yes
