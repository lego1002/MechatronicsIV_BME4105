; 吸塵機器人韌體（Arduino 框架）
; 編譯：./build.sh    燒錄：./flash.sh    看序列埠：./monitor.sh
; 預設是 Arduino UNO（2026-11-13 Nano 壞掉換 UNO，晶片相同、腳位編號相同）；Nano 用 ./build.sh -e nano；舊的 Nucleo 用 ./build.sh -e nucleo_l432kc
[platformio]
default_envs = uno

[env]
framework = arduino
monitor_speed = 115200
build_flags = -Wall

; Arduino Nano（ATmega328P，FT232R USB 序列埠，Optiboot @115200）
; 舊版 bootloader（57600）的 Nano 改成 board = nanoatmega328
[env:nano]
platform = atmelavr
board = nanoatmega328new

; Arduino UNO（ATmega328P，CH340 或 16U2 USB 序列埠，Optiboot @115200）
; config.h 的 AVR 腳位定義和 Nano 共用（UNO 沒有 A6/A7，本來就沒用到）
[env:uno]
platform = atmelavr
board = uno

; STM32 Nucleo-L432KC（stm32duino）
[env:nucleo_l432kc]
platform = ststm32
board = nucleo_l432kc
