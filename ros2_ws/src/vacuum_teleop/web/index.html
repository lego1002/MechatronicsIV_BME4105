<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Vacuum Teleop</title>
<style>
  :root { --fg: #fff; --dim: rgba(255,255,255,.6); --panel: rgba(0,0,0,.55); --ok: #3ddc84; --warn: #ffb300; --bad: #ff5252; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--fg); overflow: hidden;
               font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif; user-select: none; }
  #video { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
  .panel { position: fixed; background: var(--panel); border-radius: 12px; padding: 8px 12px; backdrop-filter: blur(4px); }
  #hud { top: 10px; left: 50%; transform: translateX(-50%); text-align: center; width: min(420px, calc(100% - 32px)); }
  #tape { width: 100%; height: 34px; display: block; }
  #yawRow { display: flex; align-items: center; justify-content: center; gap: 14px; }
  #yaw { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 4.5ch; }
  #car { width: 40px; height: 40px; }
  #rate { color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; }
  #stats { top: 10px; left: 10px; font-size: 12px; line-height: 1.6; font-variant-numeric: tabular-nums; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--bad); margin-right: 5px; }
  #log { bottom: 10px; left: 50%; transform: translateX(-50%); font-size: 12px; max-width: calc(100% - 32px);
         white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity .3s; }
  #joy { position: fixed; left: 24px; bottom: 24px; width: 160px; height: 160px; border-radius: 50%;
         background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.35); touch-action: none; }
  #knob { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px;
          border-radius: 50%; background: rgba(255,255,255,.75); pointer-events: none; }
  #right { position: fixed; right: 20px; bottom: 24px; display: flex; flex-direction: column; gap: 12px; align-items: flex-end; }
  button { font: inherit; font-size: 16px; border: 0; border-radius: 12px; padding: 12px 18px; color: #fff;
           background: rgba(255,255,255,.18); touch-action: manipulation; }
  button:active { background: rgba(255,255,255,.35); }
  #vac.on { background: var(--ok); color: #000; font-weight: 700; }
  #stop { background: var(--bad); font-weight: 700; font-size: 20px; padding: 18px 26px; }
  #right .panel { position: static; }  /* .panel 預設 fixed 會脫離排版，蓋住右下的按鈕 */
  .spd { font-size: 14px; display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 12px; }
  .spd b { min-width: 4ch; text-align: right; font-size: 18px; font-variant-numeric: tabular-nums; }
  .spd button { padding: 6px 14px; font-size: 18px; }
  #help { font-size: 12px; line-height: 1.6; text-align: right; }
  #help kbd { font: inherit; font-weight: 700; color: var(--ok); }
  #cam { top: 10px; right: 10px; font-size: 14px; display: flex; flex-direction: column; gap: 6px; }
  #cam .row { display: flex; gap: 6px; align-items: center; }
  #cam button { padding: 8px 12px; font-size: 15px; flex: 1; white-space: nowrap; }
  #cam button.cur { background: var(--ok); color: #000; font-weight: 700; }
  #cam.saving [data-preset] { outline: 2px dashed var(--warn); }
  #camSave.on { background: var(--warn); color: #000; }
  #camTxt { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 4ch; text-align: right; }
  @media (hover: none) { #help { display: none; } }
  @media (max-width: 520px) { #stats { top: auto; bottom: 200px; } }
  @media (max-width: 1000px) { #cam { top: 130px; } }  /* 窄螢幕放到航向 HUD 下面，避免重疊 */
</style>
</head>
<body>
<iframe id="video" allow="autoplay"></iframe>

<div id="hud" class="panel">
  <canvas id="tape"></canvas>
  <div id="yawRow">
    <svg id="car" viewBox="-20 -20 40 40"><g id="carG">
      <rect x="-9" y="-12" width="18" height="24" rx="4" fill="none" stroke="#fff" stroke-width="2.5"/>
      <path d="M0 -18 L6 -10 L-6 -10 Z" fill="#3ddc84"/></g></svg>
    <div id="yaw">--°</div>
  </div>
  <div id="rate">-- °/s</div>
</div>

<div id="stats" class="panel">
  <div><span class="dot" id="wsDot"></span><span id="wsTxt">連線中…</span></div>
  <div id="mcuTxt">Nano：--</div>
  <div>網頁↔Pi：<span id="rttWeb">--</span> ms</div>
  <div>Pi↔Nano：<span id="rttMcu">--</span> ms</div>
  <div id="cmdTxt">指令：0 / 0</div>
</div>

<div id="cam" class="panel">
  <div class="row">相機搖臂 <span style="flex:1"></span><b id="camTxt">--</b></div>
  <div class="row">
    <button data-preset="cruise" title="快捷鍵 1">巡航</button>
    <button data-preset="paper" title="快捷鍵 2（鏡頭壓低）">看紙片</button>
    <button data-preset="red" title="快捷鍵 3（鏡頭抬高）">看紅點</button>
  </div>
  <div class="row">
    <button data-cam="-5" title="快捷鍵 V">−5°</button>
    <button data-cam="5" title="快捷鍵 R">+5°</button>
    <button id="camSave" title="按這個，再按一個模式：把目前角度存成那個模式">存成模式</button>
  </div>
</div>

<div id="log" class="panel"></div>

<div id="joy"><div id="knob"></div></div>

<div id="right">
  <div id="help" class="panel">
    <div>移動（按住）<kbd>U I O</kbd> / <kbd>J L</kbd> / <kbd>M , .</kbd> 或方向鍵</div>
    <div>停車 <kbd>K</kbd> 或空白鍵</div>
    <div>加／減速 全部 <kbd>Q</kbd>/<kbd>Z</kbd> 或 <kbd>+</kbd>/<kbd>−</kbd> · 線速度 <kbd>W</kbd>/<kbd>X</kbd> · 角速度 <kbd>E</kbd>/<kbd>C</kbd></div>
    <div>歸零 <kbd>0</kbd> · 吸塵器 <kbd>F</kbd></div>
    <div>相機 巡航 <kbd>1</kbd> · 看紙片 <kbd>2</kbd> · 看紅點 <kbd>3</kbd> · 微調 <kbd>R</kbd>/<kbd>V</kbd></div>
  </div>
  <div class="spd panel">線速度 <button data-lin="-5" aria-label="線速度減少">−</button><b id="linTxt"></b><button data-lin="5" aria-label="線速度增加">+</button></div>
  <div class="spd panel">角速度 <button data-ang="-5" aria-label="角速度減少">−</button><b id="angTxt"></b><button data-ang="5" aria-label="角速度增加">+</button></div>
  <div class="spd panel" title="起步從 0 加到全速要花的時間，越長越柔、越不會拉垮電池">加速 <button data-acc="-100" aria-label="加速時間減少">−</button><b id="accTxt">--</b><button data-acc="100" aria-label="加速時間增加">+</button></div>
  <button id="vac" aria-pressed="false">吸塵器：關</button>
  <button id="zero">航向歸零</button>
  <button id="stop">STOP</button>
</div>

<script>
const $ = id => document.getElementById(id);
const host = location.hostname;
$('video').src = `http://${host}:8889/cam/?controls=false&muted=true&autoplay=true&playsinline=true`;
// 用 Tailscale（100.64.0.0/10）開網頁：影像會被限速，而且 MediaMTX 已排除 tailscale0，影像很可能連不上
if (/^100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\./.test(host)) {
  const w = document.createElement('div');
  w.className = 'panel';
  w.style.cssText = 'top:120px;left:50%;transform:translateX(-50%);background:var(--bad);font-weight:700;text-align:center;z-index:9';
  w.textContent = '⚠ 你正在用 Tailscale 網址，影像會卡或看不到。請連同一個 Wi-Fi，改用 Pi 選單（./menu.sh）上的 192.168.x.x 網址';
  document.body.appendChild(w);
}

// ---------- WebSocket ----------
let ws = null, pingSent = {}, pingId = 0;
function connect() {
  ws = new WebSocket(`ws://${location.host}/ws?k=__WS_TOKEN__`);
  let opened = false;
  ws.onopen = () => { opened = true; $('wsDot').style.background = 'var(--ok)'; $('wsTxt').textContent = '已連線'; };
  ws.onclose = () => {
    $('wsDot').style.background = 'var(--bad)'; $('wsTxt').textContent = '斷線，重連中…';
    showVacuum(false);  // 所有人都斷線時伺服器會關吸塵器；重連後由遙測更新
    // 一次都沒連上：可能是 token 失效（伺服器重開過）。網頁拿得到就重新載入拿新的 token，拿不到（Pi 斷線）就繼續重試
    if (!opened) setTimeout(() => fetch(location.href, { cache: 'no-store' })
      .then(r => r.ok ? location.reload() : connect())
      .catch(connect), 2000);
    else setTimeout(connect, 1000);
  };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.t === 'tel') showTelemetry(m);
    else if (m.t === 'pong' && pingSent[m.id]) {
      $('rttWeb').textContent = (performance.now() - pingSent[m.id]).toFixed(0);
      delete pingSent[m.id];
    } else if (m.t === 'log') showLog(m.msg);
  };
}
function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }
setInterval(() => { pingSent = { [++pingId]: performance.now() }; send({ t: 'ping', id: pingId }); }, 1000);
connect();

// ---------- 遙測 ----------
const ST = { 0: ['正常', 'var(--ok)'], 1: ['IMU 校正中，請勿移動', 'var(--warn)'],
             2: ['IMU 錯誤（檢查接線）', 'var(--bad)'], 255: ['斷線或沒有回應', 'var(--bad)'] };
let yaw = 0;
function showTelemetry(m) {
  yaw = m.yaw;
  $('yaw').textContent = m.yaw.toFixed(1) + '°';
  $('rate').textContent = m.rate.toFixed(1) + ' °/s';
  $('carG').setAttribute('transform', `rotate(${-m.yaw})`);  // 逆時針為正
  const [txt, col] = ST[m.st] || ['?', 'var(--bad)'];
  $('mcuTxt').innerHTML = `Nano：<span style="color:${col}">${txt}</span>`;
  $('rttMcu').textContent = m.rtt == null ? '--' : m.rtt.toFixed(1);
  showVacuum(m.vac);
  accMs = m.acc;
  $('accTxt').textContent = m.acc == null ? '--' : (m.acc / 1000).toFixed(1) + 's';
  showCam(m);
  drawTape();
}
// 按鈕只顯示韌體回報的實際狀態，不是按下去就算數
let vacOn = false;
function showVacuum(on) {
  vacOn = on;  // 韌體回報的狀態，按鈕切換用這個
  $('vac').classList.toggle('on', on);
  $('vac').setAttribute('aria-pressed', on);
  $('vac').textContent = on ? '吸塵器：開' : '吸塵器：關';
}
let logTimer;
function showLog(msg) {
  $('log').textContent = 'Nano：' + msg; $('log').style.opacity = 1;
  clearTimeout(logTimer); logTimer = setTimeout(() => $('log').style.opacity = 0, 4000);
}

// 航向刻度帶：左轉（yaw 變大）時刻度往右移
const tape = $('tape'), ctx = tape.getContext('2d');
function drawTape() {
  const dpr = window.devicePixelRatio || 1, W = tape.clientWidth, H = tape.clientHeight;
  if (tape.width !== W * dpr) { tape.width = W * dpr; tape.height = H * dpr; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const pxPerDeg = W / 120, cx = W / 2;
  ctx.strokeStyle = '#fff'; ctx.fillStyle = '#fff'; ctx.font = '11px system-ui'; ctx.textAlign = 'center';
  for (let a = Math.ceil((yaw - 70) / 5) * 5; a <= yaw + 70; a += 5) {
    const x = cx - (a - yaw) * pxPerDeg, major = a % 30 === 0;
    ctx.globalAlpha = 1 - Math.abs(x - cx) / cx * 0.8;
    ctx.beginPath(); ctx.moveTo(x, H); ctx.lineTo(x, H - (major ? 14 : a % 10 === 0 ? 9 : 5)); ctx.stroke();
    if (major) { let d = ((a + 180) % 360 + 360) % 360 - 180; ctx.fillText(d, x, 11); }
  }
  ctx.globalAlpha = 1; ctx.fillStyle = '#3ddc84';
  ctx.beginPath(); ctx.moveTo(cx, H - 16); ctx.lineTo(cx - 6, H - 26); ctx.lineTo(cx + 6, H - 26); ctx.fill();
}
window.addEventListener('resize', drawTape);
drawTape();

// ---------- 相機搖臂 ----------
// 顯示韌體回報的角度；還沒回報（Nano 沒接）就顯示伺服器的目標角度加問號
let camT = null, camSaving = false;
function showCam(m) {
  camT = m.camt;
  $('camTxt').textContent = m.cam == null ? `${m.camt}°?` : m.cam < 0 ? '放鬆' : m.cam + '°';
  for (const b of document.querySelectorAll('[data-preset]')) {
    const deg = m.camp[b.dataset.preset];
    b.classList.toggle('cur', deg === m.camt);
    b.dataset.deg = deg;
    b.title = b.title.replace(/ · \d+°$/, '') + ` · ${deg}°`;
  }
}
function camPreset(name) {
  if (camSaving) { send({ t: 'cam_save', name }); camSaveMode(false); }
  else send({ t: 'cam_preset', name });
}
function camStep(d) { if (camT != null) send({ t: 'cam', deg: Math.max(0, Math.min(180, camT + d)) }); }
function camSaveMode(on) { camSaving = on; $('cam').classList.toggle('saving', on); $('camSave').classList.toggle('on', on); }
for (const b of document.querySelectorAll('[data-preset]')) b.onclick = () => camPreset(b.dataset.preset);
for (const b of document.querySelectorAll('[data-cam]')) b.onclick = () => camStep(+b.dataset.cam);
$('camSave').onclick = () => camSaveMode(!camSaving);
const CAM_KEYS = { Digit1: 'cruise', Numpad1: 'cruise', Digit2: 'paper', Numpad2: 'paper', Digit3: 'red', Numpad3: 'red' };

// ---------- 控制 ----------
const keys = new Set();
let joy = null;  // {v, w}，-1~1
// 線速度、角速度分開調（滿速的百分比）
let linPct = 40, angPct = 25;
const clampPct = p => Math.max(5, Math.min(100, p));
function adjustSpeed(dLin, dAng) {
  linPct = clampPct(linPct + dLin); angPct = clampPct(angPct + dAng);
  $('linTxt').textContent = linPct + '%'; $('angTxt').textContent = angPct + '%';
}
adjustSpeed(0, 0);

// 按鍵配置同 teleop_twist_keyboard，[線, 角]，角速度正 = 左轉。
// 用 e.code（實體按鍵）判斷，開著注音或大寫鎖定也能用，放開時也不會對不上而卡鍵
const MOVE = { KeyU: [1, 1], KeyI: [1, 0], KeyO: [1, -1], KeyJ: [0, 1], KeyL: [0, -1],
               KeyM: [-1, -1], Comma: [-1, 0], Period: [-1, 1],
               ArrowUp: [1, 0], ArrowDown: [-1, 0], ArrowLeft: [0, 1], ArrowRight: [0, -1] };
// +/- 同 Q/Z（線、角一起調）；主鍵盤的 + 跟 = 同一顆鍵，有沒有按 Shift 都算
const SPEED = { KeyQ: [5, 5], KeyZ: [-5, -5], Equal: [5, 5], Minus: [-5, -5], NumpadAdd: [5, 5], NumpadSubtract: [-5, -5], KeyW: [5, 0], KeyX: [-5, 0], KeyE: [0, 5], KeyC: [0, -5] };
const clamp1 = x => Math.max(-1, Math.min(1, x));

function currentCmd() {
  let v = 0, w = 0;
  if (joy) ({ v, w } = joy);
  else {
    for (const k of keys) { v += MOVE[k][0]; w += MOVE[k][1]; }
    v = clamp1(v); w = clamp1(w);
  }
  return { v: v * linPct / 100, w: w * angPct / 100 };
}
// 20Hz 持續送指令（伺服器 0.3 秒沒收到就自動停車）
let idleSent = 0;
setInterval(() => {
  const c = currentCmd(), moving = c.v !== 0 || c.w !== 0;
  if (moving) idleSent = 0;
  if (moving || idleSent++ < 3) send({ t: 'cmd', v: c.v, w: c.w });
  $('cmdTxt').textContent = `指令：${c.v.toFixed(2)} / ${c.w.toFixed(2)}`;
}, 50);

function stop() { keys.clear(); joy = null; resetKnob(); send({ t: 'cmd', v: 0, w: 0 }); }
$('stop').onclick = stop;
$('zero').onclick = () => send({ t: 'zero' });
function toggleVacuum() { send({ t: 'vacuum', on: !vacOn }); }
$('vac').onclick = toggleVacuum;
for (const b of document.querySelectorAll('[data-lin]')) b.onclick = () => adjustSpeed(+b.dataset.lin, 0);
for (const b of document.querySelectorAll('[data-ang]')) b.onclick = () => adjustSpeed(0, +b.dataset.ang);
// 加速時間：存在 Pi（bridge）上，顯示的是韌體回報的實際值，所有人看到的都一樣
let accMs = null;
for (const b of document.querySelectorAll('[data-acc]')) b.onclick = () => {
  if (accMs != null) send({ t: 'accel', ms: Math.max(0, Math.min(2000, accMs + +b.dataset.acc)) });
};
// 按完放掉焦點，不然接著按空白鍵（停車）會變成再按一次這個按鈕
document.addEventListener('click', e => { const b = e.target.closest('button'); if (b) b.blur(); });

window.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;  // 不要吃掉 Ctrl+R、Ctrl+C 這類瀏覽器快捷鍵
  const c = e.code;
  if (c === 'Space' || c === 'KeyK') { stop(); e.preventDefault(); }
  else if (c === 'Digit0' || c === 'Numpad0') { if (!e.repeat) send({ t: 'zero' }); }
  else if (c === 'KeyF') { if (!e.repeat) toggleVacuum(); }
  else if (CAM_KEYS[c]) { if (!e.repeat) camPreset(CAM_KEYS[c]); }
  else if (c === 'KeyR') camStep(5);
  else if (c === 'KeyV') camStep(-5);
  else if (c === 'Escape') camSaveMode(false);
  // 忽略自動重複：不然按住移動鍵時按停車，下一次重複又會讓車子動起來
  else if (MOVE[c]) { if (!e.repeat) keys.add(c); e.preventDefault(); }
  else if (SPEED[c]) { adjustSpeed(...SPEED[c]); e.preventDefault(); }
});
window.addEventListener('keyup', e => keys.delete(e.code));
window.addEventListener('blur', stop);
document.addEventListener('visibilitychange', () => { if (document.hidden) stop(); });

// 搖桿（觸控／滑鼠）
const pad = $('joy'), knob = $('knob');
function resetKnob() { knob.style.transform = ''; }
function onJoy(e) {
  const r = pad.getBoundingClientRect(), R = r.width / 2;
  let dx = e.clientX - (r.left + R), dy = e.clientY - (r.top + R);
  const d = Math.hypot(dx, dy);
  if (d > R) { dx *= R / d; dy *= R / d; }
  knob.style.transform = `translate(${dx}px, ${dy}px)`;
  const dead = v => Math.abs(v) < 0.08 ? 0 : v;
  joy = { v: dead(-dy / R), w: dead(-dx / R) };
}
pad.addEventListener('pointerdown', e => { pad.setPointerCapture(e.pointerId); onJoy(e); });
pad.addEventListener('pointermove', e => { if (pad.hasPointerCapture(e.pointerId)) onJoy(e); });
for (const ev of ['pointerup', 'pointercancel']) pad.addEventListener(ev, () => { joy = null; resetKnob(); });
</script>
</body>
</html>
